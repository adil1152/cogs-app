openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: COGS (Cost of Goods Sold) Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Users
    description: User and role management
  - name: Projects
    description: Projects and contract metadata
  - name: Services
    description: Project-level service lines
  - name: Access
    description: Per-project security and report visibility
  - name: Entries
    description: Daily mandays and service cost entries
  - name: Reports
    description: Dashboards, summaries and aggregations
  - name: Attachments
    description: PDF (and other) file attachments on daily entries.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Settings
    description: Application-wide settings (SMTP email configuration).
  - name: MIS
    description: Management Information System operations. MIS authorization is separate from COGS.
paths:
  /admin/audit-log:
    get:
      operationId: listSystemAuditLog
      tags: [Settings]
      summary: Administrator-only system change history
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: search, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string, enum: [COGS, MIS, System]}}
        - {name: action, in: query, schema: {type: string, enum: [INSERT, UPDATE, DELETE]}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        "200":
          description: Paginated immutable change history
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, occurredAt, module, actorName, action, entityType, changedFields]
                      properties:
                        id: {type: string}
                        occurredAt: {type: string}
                        module: {type: string}
                        actorId: {type: string, nullable: true}
                        actorName: {type: string}
                        action: {type: string}
                        entityType: {type: string}
                        entityId: {type: string, nullable: true}
                        entityName: {type: string, nullable: true}
                        projectId: {type: string, nullable: true}
                        projectName: {type: string, nullable: true}
                        requestId: {type: string, nullable: true}
                        path: {type: string, nullable: true}
                        changedFields: {type: array, items: {type: string}}
                        oldValues: {type: object, additionalProperties: {}, nullable: true}
                        newValues: {type: object, additionalProperties: {}, nullable: true}
        "401":
          description: Authentication required
        "403":
          description: Admin required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '409':
          description: Stored account details are invalid. Administrator review is required before retrying; no account data is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerWithPassword
      summary: Create an account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBody'
      responses:
        '200':
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already taken with a password set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '409':
          description: Credentials verified but stored account details are invalid. Contact an administrator and retry after approved repair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear the current session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /auth/me:
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      summary: Update the current user's profile (name + mobile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeBody'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me/password:
    post:
      tags: [Auth]
      operationId: changeMyPassword
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordBody'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Current password did not match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email (public, never reveals whether the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordBody'
      responses:
        '200':
          description: Accepted (sent if the account exists and email is configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using an emailed reset token (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordBody'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid or expired token / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /settings/smtp:
    get:
      tags: [Settings]
      operationId: getSmtpSettings
      summary: Get the configured SMTP settings (admin only, password never returned)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpSettings'
    put:
      tags: [Settings]
      operationId: updateSmtpSettings
      summary: Create or update the SMTP settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSmtpSettingsBody'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpSettings'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /settings/smtp/test:
    post:
      tags: [Settings]
      operationId: testSmtpSettings
      summary: Send a test email using the saved SMTP settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSmtpBody'
      responses:
        '200':
          description: Test email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: SMTP not configured or send failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List all users (for admin role and access management)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppUser'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user's profile, role, or password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /users/{id}/role:
    patch:
      tags: [Users]
      operationId: updateUserRole
      summary: Promote or demote a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUser'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects visible to the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a new project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
    patch:
      tags: [Projects]
      operationId: updateProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      tags: [Projects]
      operationId: deleteProject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /projects/{id}/services:
    get:
      tags: [Services]
      operationId: listProjectServices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectService'
    post:
      tags: [Services]
      operationId: createProjectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectServiceBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectService'
  /projects/{id}/services/reorder:
    patch:
      tags: [Services]
      operationId: reorderProjectServices
      summary: Bulk update sort order for a project's services (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProjectServicesBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectService'
  /services/{id}:
    patch:
      tags: [Services]
      operationId: updateProjectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectServiceBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectService'
    delete:
      tags: [Services]
      operationId: deleteProjectService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /security-groups:
    get:
      tags: [SecurityGroups]
      operationId: listSecurityGroups
      summary: List all security groups (admin only).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityGroup'
    post:
      tags: [SecurityGroups]
      operationId: createSecurityGroup
      summary: Create a new security group (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityGroupBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroup'
  /security-groups/{id}:
    patch:
      tags: [SecurityGroups]
      operationId: updateSecurityGroup
      summary: Edit a security group (admin only). Changes propagate to all access rows that reference it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecurityGroupBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroup'
    delete:
      tags: [SecurityGroups]
      operationId: deleteSecurityGroup
      summary: Delete a security group (admin only). Blocked while any access row still references it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '409':
          description: Group is still in use; remove or reassign access rows first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /security-groups/{id}/members:
    get:
      tags: [SecurityGroups]
      operationId: listSecurityGroupMembers
      summary: List global members of a security group (admin only). Members get the group's flags on every project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityGroupMember'
    post:
      tags: [SecurityGroups]
      operationId: addSecurityGroupMember
      summary: Add a user as a global member of a security group (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSecurityGroupMemberBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupMember'
        '409':
          description: User is already a member of this group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /security-group-members/{id}:
    delete:
      tags: [SecurityGroups]
      operationId: removeSecurityGroupMember
      summary: Remove a global member from a security group (admin only).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Removed

  /projects/{id}/access:
    get:
      tags: [Access]
      operationId: listProjectAccess
      summary: List users with security access to this project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectAccess'
    post:
      tags: [Access]
      operationId: grantProjectAccess
      summary: Grant a user permission to view summary reports for this project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantAccessBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccess'
  /access/{id}:
    patch:
      tags: [Access]
      operationId: updateProjectAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccessBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAccess'
    delete:
      tags: [Access]
      operationId: revokeProjectAccess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /projects/{id}/entries:
    get:
      tags: [Entries]
      operationId: listProjectEntries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: statuses
          in: query
          required: false
          description: Comma-separated list of entry statuses (draft|pending|approved). Defaults to all.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyEntrySummary'
    post:
      tags: [Entries]
      operationId: createDailyEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDailyEntryBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntryDetail'
  /entries/{id}:
    get:
      tags: [Entries]
      operationId: getDailyEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntryDetail'
    patch:
      tags: [Entries]
      operationId: updateDailyEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDailyEntryBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntryDetail'
    delete:
      tags: [Entries]
      operationId: deleteDailyEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /entries/{id}/approve:
    post:
      tags: [Entries]
      operationId: approveDailyEntry
      summary: Advance the entry one approval level. Allowed for admins or the user assigned as the next-level approver on this project. Locks at final level.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntryDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /entries/{id}/reject:
    post:
      tags: [Entries]
      operationId: rejectDailyEntry
      summary: Revoke the most recent approval and return the entry to draft. Allowed for admins or the user assigned at the current approval level.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyEntryDetail'
  /entries/{id}/approvals:
    get:
      tags: [Entries]
      operationId: listEntryApprovals
      summary: List approvals already granted on this entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntryApproval'
  /entries/{id}/submit:
    post:
      tags: [Entries]
      operationId: submitDailyEntry
      summary: |
        Move a draft entry into the approval queue (status draft → pending).
        Allowed for admins or any user with canEditEntries on the project.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
