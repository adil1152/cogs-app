              schema: { $ref: '#/components/schemas/MisEntry' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/bulk:
    post:
      tags: [MIS]
      operationId: misCreateBulkEntries
      summary: Create all non-blank service lines for a project period atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisBulkEntriesInput' }
      responses:
        '201':
          description: All saved lines, in input order. Blank lines are omitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisBulkEntriesResponse' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/creators:
    get:
      tags: [MIS]
      operationId: misListEntryCreators
      summary: List distinct creators of permitted MIS bulk parents
      description: Returns only accounts that created a bulk parent in a project where the caller has view_entries permission.
      parameters:
        - { $ref: '#/components/parameters/MisSearchQuery' }
        - { $ref: '#/components/parameters/MisPageQuery' }
        - { $ref: '#/components/parameters/MisPageSizeQuery' }
      responses:
        '200':
          description: Creators of permitted bulk parents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisUserPickerPage' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/parents:
    get:
      tags: [MIS]
      operationId: misListEntryParents
      summary: Search permitted atomic MIS bulk parents
      parameters:
        - { name: bulkNumber, in: query, schema: { type: string, maxLength: 32 } }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: projectNumber, in: query, schema: { type: string, maxLength: 32 } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, schema: { type: string, format: date } }
        - { name: createdById, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/MisEntryStatusQuery' }
        - { name: entryType, in: query, schema: { type: string, enum: [bulk] } }
        - { $ref: '#/components/parameters/MisSearchQuery' }
        - { $ref: '#/components/parameters/MisPageQuery' }
        - { $ref: '#/components/parameters/MisPageSizeQuery' }
      responses:
        '200':
          description: Paginated permitted bulk parents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisParentPage' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/parents/{id}:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    get:
      tags: [MIS]
      operationId: misGetEntryParent
      summary: Get one permitted bulk parent and all children
      responses:
        '200':
          description: Atomic bulk parent and child service lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisParentDetail' }
        default: { $ref: '#/components/responses/MisError' }
    patch:
      tags: [MIS]
      operationId: misUpdateEntryParent
      summary: Replace all child lines in a bulk parent atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisParentEditInput' }
      responses:
        '200':
          description: Updated parent and synchronized children.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisParentMutationResponse' }
        default: { $ref: '#/components/responses/MisError' }
    delete:
      tags: [MIS]
      operationId: misDeleteEntryParent
      summary: Delete a permitted bulk parent and all children atomically
      responses:
        '200':
          description: Bulk parent deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisParentDeleteResponse' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/parents/{id}/action:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    post:
      tags: [MIS]
      operationId: misActOnEntryParent
      summary: Apply one workflow action to a bulk parent and every child
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisParentActionInput' }
      responses:
        '200':
          description: Workflow action completed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisParentMutationResponse' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/parents/{id}/history:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    get:
      tags: [MIS]
      operationId: misGetEntryParentHistory
      summary: Get append-only audit history for a bulk parent
      responses:
        '200':
          description: Parent history, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MisParentHistoryItem' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/{id}:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    get:
      tags: [MIS]
      operationId: misGetEntry
      summary: Get one permitted MIS entry
      responses:
        '200':
          description: Entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisEntry' }
        default: { $ref: '#/components/responses/MisError' }
    patch:
      tags: [MIS]
      operationId: misUpdateEntry
      summary: Replace writable MIS entry values
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisEntryInput' }
      responses:
        '200':
          description: Entry updated; amount and snapshots are recomputed by the server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisEntry' }
        default: { $ref: '#/components/responses/MisError' }
    delete:
      tags: [MIS]
      operationId: misDeleteEntry
      summary: Delete an MIS entry when the caller has the required permission
      responses:
        '200':
          description: Entry deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/{id}/action:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    post:
      tags: [MIS]
      operationId: misActOnEntry
      summary: Submit, approve, reject, reset, or cancel an MIS entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisEntryActionInput' }
      responses:
        '200':
          description: Entry workflow action completed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisEntry' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/entries/{id}/history:
    parameters:
      - $ref: '#/components/parameters/MisIdPath'
    get:
      tags: [MIS]
      operationId: misGetEntryHistory
      summary: Get the permission-gated audit history for an MIS entry
      responses:
        '200':
          description: Entry history, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MisEntryHistoryItem' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/reports:
    get:
      tags: [MIS]
      operationId: misGetReport
      summary: Run a currency-safe unified MIS report over permitted projects
      parameters:
        - $ref: '#/components/parameters/MisProjectIdsQuery'
        - $ref: '#/components/parameters/MisTabIdQuery'
        - $ref: '#/components/parameters/MisServiceIdQuery'
        - $ref: '#/components/parameters/MisFromQuery'
        - $ref: '#/components/parameters/MisToQuery'
        - $ref: '#/components/parameters/MisEntryStatusDefaultApprovedQuery'
        - $ref: '#/components/parameters/MisEntryTypeQuery'
        - $ref: '#/components/parameters/MisSearchQuery'
        - $ref: '#/components/parameters/MisReportTypeQuery'
        - $ref: '#/components/parameters/MisCompareFromQuery'
        - $ref: '#/components/parameters/MisCompareToQuery'
        - $ref: '#/components/parameters/MisCurrencyQuery'
      responses:
        '200':
          description: Currency-separated totals, comparison totals, and grouping rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisReport' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/reports/export:
    get:
      tags: [MIS]
      operationId: misExportReport
      summary: Export a permitted unified MIS report
      parameters:
        - $ref: '#/components/parameters/MisProjectIdsQuery'
        - $ref: '#/components/parameters/MisTabIdQuery'
        - $ref: '#/components/parameters/MisServiceIdQuery'
        - $ref: '#/components/parameters/MisFromQuery'
        - $ref: '#/components/parameters/MisToQuery'
        - $ref: '#/components/parameters/MisEntryStatusDefaultApprovedQuery'
        - $ref: '#/components/parameters/MisEntryTypeQuery'
        - $ref: '#/components/parameters/MisSearchQuery'
        - $ref: '#/components/parameters/MisReportTypeQuery'
        - $ref: '#/components/parameters/MisCompareFromQuery'
        - $ref: '#/components/parameters/MisCompareToQuery'
        - $ref: '#/components/parameters/MisCurrencyQuery'
        - $ref: '#/components/parameters/MisExportFormatQuery'
      responses:
        '200':
          description: Binary report export in the requested format.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/MisError' }
  /mis/dashboard/export:
    get:
      tags: [MIS]
      operationId: misExportDashboard
      summary: Download the MIS Dashboard or MIS Overview Report as PDF or Excel
      description: Server-computed export of the same dashboard aggregates. Requires reports, financial and export permission for every included project.
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [pdf, xlsx] }
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [dashboard, overview] }
        - $ref: '#/components/parameters/MisProjectIdsQuery'
        - $ref: '#/components/parameters/MisTabIdQuery'
        - $ref: '#/components/parameters/MisServiceIdQuery'
        - $ref: '#/components/parameters/MisFromQuery'
        - $ref: '#/components/parameters/MisToQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [all, draft, submitted, approved, rejected, returned, cancelled]
            default: all
      responses:
        '200':
          description: Binary PDF or XLSX document.
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/MisError' }
  /mis/projects/{id}/percentage-services:
    get:
      tags: [MIS]
      operationId: misListPercentageServices
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/MisPercentageKind' } }
      responses:
        '200':
          description: Permission-protected project percentage services.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MisPercentageService' } }
        default: { $ref: '#/components/responses/MisError' }
    post:
      tags: [MIS]
      operationId: misCreatePercentageService
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisPercentageServiceInput' }
      responses:
        '201':
          description: Created percentage service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisPercentageService' }
        default: { $ref: '#/components/responses/MisError' }
  /mis/projects/{id}/percentage-services/{serviceId}:
    patch:
      tags: [MIS]
      operationId: misUpdatePercentageService
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: serviceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MisPercentageServiceInput' }
      responses:
        '200':
          description: Updated percentage service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisPercentageService' }
        default: { $ref: '#/components/responses/MisError' }
    delete:
      tags: [MIS]
      operationId: misDeletePercentageService
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: serviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted percentage service. }
        default: { $ref: '#/components/responses/MisError' }
  /mis/dashboard:
    get:
      tags: [MIS]
      operationId: misGetDashboard
      summary: Get currency-safe MIS dashboard aggregates for permitted projects
      parameters:
        - name: includeServices
          in: query
          description: Include service-level financial breakdowns for the separate overview report.
          schema:
            type: string
            enum: ["true", "false"]
        - $ref: '#/components/parameters/MisProjectIdsQuery'
        - $ref: '#/components/parameters/MisTabIdQuery'
        - $ref: '#/components/parameters/MisServiceIdQuery'
        - $ref: '#/components/parameters/MisFromQuery'
        - $ref: '#/components/parameters/MisToQuery'
        - name: status
          in: query
          schema:
            type: string
            enum: [all, draft, submitted, approved, rejected, returned, cancelled]
            default: all
        - $ref: '#/components/parameters/MisEntryTypeQuery'
        - $ref: '#/components/parameters/MisSearchQuery'
      responses:
        '200':
          description: Currency-separated dashboard totals, breakdowns, and recent permitted entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisDashboard' }
        default: { $ref: '#/components/responses/MisError' }

  /mis/analytics:
    get:
      operationId: getMisAnalytics
      tags: [MIS]
      summary: Get permission-scoped advanced MIS analytics
      parameters:
        - $ref: '#/components/parameters/MisAnalyticsProjectIds'
        - $ref: '#/components/parameters/MisAnalyticsProjectCode'
        - $ref: '#/components/parameters/MisAnalyticsTabIds'
        - $ref: '#/components/parameters/MisAnalyticsServiceIds'
        - $ref: '#/components/parameters/MisAnalyticsServiceCodes'
        - $ref: '#/components/parameters/MisAnalyticsTypes'
        - $ref: '#/components/parameters/MisAnalyticsReportType'
        - $ref: '#/components/parameters/MisAnalyticsSearch'
        - $ref: '#/components/parameters/MisAnalyticsCurrency'
        - $ref: '#/components/parameters/MisAnalyticsFrom'
        - $ref: '#/components/parameters/MisAnalyticsTo'
        - $ref: '#/components/parameters/MisAnalyticsStatus'
        - $ref: '#/components/parameters/MisAnalyticsCompareFrom'
        - $ref: '#/components/parameters/MisAnalyticsCompareTo'
        - $ref: '#/components/parameters/MisAnalyticsGroupBy'
        - $ref: '#/components/parameters/MisAnalyticsView'
        - $ref: '#/components/parameters/MisAnalyticsMode'
        - $ref: '#/components/parameters/MisAnalyticsPage'
        - $ref: '#/components/parameters/MisAnalyticsPageSize'
        - $ref: '#/components/parameters/MisAnalyticsPeriodComparison'
        - $ref: '#/components/parameters/MisAnalyticsPeriods'
      responses:
        '200':
          description: Currency-safe aggregate analytics response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisAnalyticsEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mis/analytics/export:
    get:
      operationId: exportMisAnalytics
      tags: [MIS]
      summary: Export all permission-scoped MIS analytics rows
      parameters:
        - $ref: '#/components/parameters/MisAnalyticsProjectIds'
        - $ref: '#/components/parameters/MisAnalyticsProjectCode'
        - $ref: '#/components/parameters/MisAnalyticsTabIds'
        - $ref: '#/components/parameters/MisAnalyticsServiceIds'
        - $ref: '#/components/parameters/MisAnalyticsServiceCodes'
        - $ref: '#/components/parameters/MisAnalyticsTypes'
        - $ref: '#/components/parameters/MisAnalyticsReportType'
        - $ref: '#/components/parameters/MisAnalyticsSearch'
        - $ref: '#/components/parameters/MisAnalyticsCurrency'
        - $ref: '#/components/parameters/MisAnalyticsFrom'
        - $ref: '#/components/parameters/MisAnalyticsTo'
        - $ref: '#/components/parameters/MisAnalyticsStatus'
        - $ref: '#/components/parameters/MisAnalyticsCompareFrom'
        - $ref: '#/components/parameters/MisAnalyticsCompareTo'
        - $ref: '#/components/parameters/MisAnalyticsGroupBy'
        - $ref: '#/components/parameters/MisAnalyticsView'
        - $ref: '#/components/parameters/MisAnalyticsMode'
        - $ref: '#/components/parameters/MisAnalyticsPeriodComparison'
        - $ref: '#/components/parameters/MisAnalyticsPeriods'
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [csv, xlsx, pdf] }
      responses:
        '200':
          description: Complete export using the requested format
          content:
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    MisIdPath:
      name: id
      in: path
      required: true
      description: MIS record identifier.
      schema: { type: string }
    MisProjectIdQuery:
      name: projectId
      in: query
      schema: { type: string }
    MisProjectIdsQuery:
      name: projectIds
      in: query
      description: Comma-separated MIS project identifiers.
      schema: { type: string }
    MisTabIdQuery:
      name: tabId
      in: query
      schema: { type: string }
    MisServiceIdQuery:
      name: serviceId
      in: query
      schema: { type: string }
    MisFromQuery:
      name: from
      in: query
      schema: { type: string, format: date }
    MisToQuery:
      name: to
      in: query
      schema: { type: string, format: date }
    MisStartFromQuery:
      name: startFrom
      in: query
      description: Inclusive lower bound for the entry period start date. Unlike `from`, this does not require full period containment.
      schema: { type: string, format: date }
    MisStartToQuery:
      name: startTo
      in: query
      description: Inclusive upper bound for the entry period start date. Unlike `to`, this does not require full period containment.
      schema: { type: string, format: date }
    MisCompareFromQuery:
      name: compareFrom
      in: query
      schema: { type: string, format: date }
    MisCompareToQuery:
      name: compareTo
      in: query
      schema: { type: string, format: date }
    MisSearchQuery:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    MisPageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    MisPageSizeQuery:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    MisActiveQuery:
      name: active
      in: query
      schema: { type: boolean }
    MisProjectStatusQuery:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/MisProjectStatus' }
    MisEntryStatusQuery:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/MisEntryStatus' }
    MisEntryStatusesQuery:
      name: statuses
      in: query
      description: Comma-separated exact subset of entry statuses. Takes precedence over the scalar status filter when supplied.
      schema:
        type: string
        pattern: '^(draft|submitted|approved|rejected|returned|cancelled)(,(draft|submitted|approved|rejected|returned|cancelled))*$'
    MisEntryStatusDefaultApprovedQuery:
      name: status
      in: query
      description: Entry status filter. Defaults to approved for report and dashboard aggregates.
      schema: { $ref: '#/components/schemas/MisEntryStatus', default: approved }
    MisEntryTypeQuery:
      name: entryType
      in: query
      schema: { $ref: '#/components/schemas/MisTabType' }
    MisReportTypeQuery:
      name: reportType
      in: query
      required: true
      schema: { $ref: '#/components/schemas/MisReportType' }
    MisCurrencyQuery:
      name: currency
      in: query
      description: Optional ISO 4217 currency. Omit to receive separate currency groups.
      schema: { type: string, minLength: 3, maxLength: 3 }
    MisEntryCurrencyQuery:
      name: currency
      in: query
      description: Optional ISO 4217 currency filter for entry snapshots.
      schema: { type: string, minLength: 3, maxLength: 3 }
    MisExportFormatQuery:
      name: format
      in: query
      required: true
      schema: { $ref: '#/components/schemas/MisExportFormat' }
    MisAnalyticsProjectIds: { name: projectIds, in: query, schema: { type: string } }
    MisAnalyticsProjectCode: { name: projectCode, in: query, schema: { type: string } }
    MisAnalyticsTabIds: { name: tabIds, in: query, schema: { type: string } }
    MisAnalyticsServiceIds: { name: serviceIds, in: query, schema: { type: string } }
    MisAnalyticsServiceCodes: { name: serviceCodes, in: query, schema: { type: string } }
    MisAnalyticsTypes: { name: types, in: query, schema: { type: string } }
    MisAnalyticsReportType:
      name: reportType
      in: query
      schema:
        type: string
        enum: [income, cost, expense, salary, summary, project-profitability, project-comparison, period-comparison, service-tab-comparison]
        default: summary
      description: >
        Report category. Category report types filter to that financial class;
        summary and comparison report types retain all configured classes.
    MisAnalyticsSearch:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
      description: Case-insensitive search over scoped project, tab, service, and entry snapshot text.
    MisAnalyticsCurrency:
      name: currency
      in: query
      schema: { type: string, pattern: '^[A-Za-z]{3}$' }
      description: Optional ISO 4217 currency filter. Omit to retain separate currency groups.
    MisAnalyticsFrom: { name: from, in: query, schema: { type: string, format: date } }
    MisAnalyticsTo: { name: to, in: query, schema: { type: string, format: date } }
    MisAnalyticsStatus:
      name: status
      in: query
      schema: { type: string, enum: [draft, submitted, approved, rejected, returned, cancelled, all], default: approved }
      description: >
        Explicit status selection. Comma-separated and repeated values are
        accepted. Use all to include every status. If absent, approved remains
        the backwards-compatible default.
    MisAnalyticsCompareFrom: { name: compareFrom, in: query, schema: { type: string, format: date } }
    MisAnalyticsCompareTo: { name: compareTo, in: query, schema: { type: string, format: date } }
    MisAnalyticsGroupBy:
      name: groupBy
      in: query
      schema: { type: string, example: "project,type" }
      description: Ordered comma-separated date, project, projectCode, type, service, month, or year.
    MisAnalyticsView:
      name: view
      in: query
      schema: { type: string, enum: [daily, weekly, monthly, custom], default: monthly }
    MisAnalyticsMode:
      name: mode
      in: query
      schema: { type: string, enum: [analytics, project, service, type, dynamic], default: analytics }
    MisAnalyticsPage: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    MisAnalyticsPageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    MisAnalyticsPeriodComparison:
      name: periodComparison
      in: query
      schema: { type: boolean, default: false }
      description: Enable additive comparison of three or more selected periods.
    MisAnalyticsPeriods:
      name: periods
      in: query
      required: false
      schema: { type: string }
      description: >
        JSON array of {id,label?,from,to} period objects. Required when
        periodComparison=true; minimum 3 and maximum 24 periods.
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The caller is not allowed to view the requested analytics scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    MisError:
      description: Authentication, authorization, validation, conflict, or not-found error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    MisAnalyticsEnvelope:
      type: object
      required: [filters, dateBasis, totalsByCurrency, rows, trend, pagination]
      properties:
        filters: { type: object }
        dateBasis: { type: string, enum: [period_start] }
        totalsByCurrency:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsCurrencyTotals' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsRow' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsRow' }
        pagination: { $ref: '#/components/schemas/MisAnalyticsPagination' }
        periods:
          type: array
          description: >
            Additive multi-period results. Each item is a period descriptor
            and the exact non-recursive analytics result fields for that period.
          items: { $ref: '#/components/schemas/MisAnalyticsPeriodResult' }
    MisAnalyticsPeriod:
      type: object
      required: [id, label, from, to]
      properties:
        id: { type: string }
        label: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
    MisAnalyticsPeriodResult:
      type: object
      required: [period, totalsByCurrency, rows, trend, pagination]
      properties:
        period: { $ref: '#/components/schemas/MisAnalyticsPeriod' }
        totalsByCurrency:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsCurrencyTotals' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsRow' }
        trend:
          type: array
          items: { $ref: '#/components/schemas/MisAnalyticsRow' }
        pagination: { $ref: '#/components/schemas/MisAnalyticsPagination' }
    MisAnalyticsCurrencyTotals:
      type: object
      required: [currency, current, previous, difference, percentageDifference]
      properties:
        currency: { type: string }
        current: { $ref: '#/components/schemas/MisAnalyticsMetricSet' }
        previous: { allOf: [{ $ref: '#/components/schemas/MisAnalyticsMetricSet' }], nullable: true }
        difference: { type: object, nullable: true }
        percentageDifference: { type: object, nullable: true }
    MisAnalyticsRow:
      type: object
      required: [currency, current, previous, difference, percentageDifference, drilldownFilters]
      properties:
        currency: { type: string }
        projectId: { type: string, nullable: true }
        projectIds: { type: array, items: { type: string } }
        projectName: { type: string, nullable: true }
        projectCode: { type: string, nullable: true }
        tabId: { type: string, nullable: true }
        tabIds: { type: array, items: { type: string } }
        tabName:
          type: string
          nullable: true
          description: Configured tab label; type groups are separated by tab ID.
        type: { type: string, nullable: true }
        serviceId: { type: string, nullable: true }
        serviceIds: { type: array, items: { type: string } }
        serviceCode: { type: string, nullable: true }
        serviceName: { type: string, nullable: true }
        serviceOrder: { type: integer, nullable: true }
        calculatePercentAgainstIncome: { type: boolean, nullable: true }
        periodId: { type: string, nullable: true }
        periodLabel: { type: string, nullable: true }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        current: { $ref: '#/components/schemas/MisAnalyticsMetricSet' }
        previous: { allOf: [{ $ref: '#/components/schemas/MisAnalyticsMetricSet' }], nullable: true }
        difference: { type: object, nullable: true }
        percentageDifference: { type: object, nullable: true }
        drilldownFilters: { $ref: '#/components/schemas/MisAnalyticsDrilldownFilters' }
        previousDrilldownFilters:
          allOf: [{ $ref: '#/components/schemas/MisAnalyticsDrilldownFilters' }]
          nullable: true
    MisAnalyticsMetricSet:
      type: object
      required: [totalIncome, totalCost, totalExpenses, totalSalaries, grossProfit, netProfit, profitMargin, totalAmount, quantity, weightedRate, rateMin, rateMax, rateVaried, units, unitVaried, entryCount]
      properties:
        totalIncome: { type: number }
        totalCost: { type: number }
        totalExpenses: { type: number }
        totalSalaries: { type: number }
        grossProfit: { type: number }
        netProfit: { type: number }
        profitMargin: { type: number }
        totalAmount: { type: number }
        quantity: { type: number }
        weightedRate: { type: number, nullable: true }
        rateMin: { type: number, nullable: true }
        rateMax: { type: number, nullable: true }
        rateVaried: { type: boolean }
        units: { type: array, items: { type: string } }
        unitVaried: { type: boolean }
        entryCount: { type: integer }
        contributionPercent: { type: number }
        incomeContributionPercent: { type: number }
        costContributionPercent: { type: number }
        expensesContributionPercent: { type: number }
        salariesContributionPercent: { type: number }
        percentageAgainstIncome:
          type: number
          nullable: true
          description: >
            Amount divided by the period/currency total income when the
            effective category/service configuration enables it; null when disabled.
    MisAnalyticsPagination:
      type: object
      required: [page, pageSize, total, pageCount]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        pageCount: { type: integer }
    MisAnalyticsDrilldownFilters:
      type: object
      description: >
        Safe filters for the Entries screen. from/to preserve the complete
        report range; startFrom/startTo constrain from_date to the displayed
        period-start bucket. Disabled project-tab assignments are never
        represented by aggregate rows.
      required: [projectIds, tabIds, serviceIds, entryType, status, statuses, currency, from, to, startFrom, startTo]
      properties:
        projectIds: { type: array, items: { type: string } }
        tabIds: { type: array, items: { type: string } }
        serviceIds: { type: array, items: { type: string } }
        entryType: { type: string, nullable: true }
        status: { type: string }
        statuses: { type: array, items: { type: string, enum: [draft, submitted, approved, rejected, returned, cancelled] } }
        currency: { type: string }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        startFrom: { type: string, format: date, nullable: true }
        startTo: { type: string, format: date, nullable: true }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, mobile, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        mobile:
          type: [string, 'null']
          description: Optional mobile number. Free-form, never required.
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, user]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 200 }
        firstName:
          type: [string, 'null']
          maxLength: 80
        lastName:
          type: [string, 'null']
          maxLength: 80
        mobile:
          type: [string, 'null']
          maxLength: 32
    LoginBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 200 }
    LogoutResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    UpdateMeBody:
      type: object
      properties:
        firstName:
          type: [string, 'null']
          maxLength: 80
        lastName:
          type: [string, 'null']
          maxLength: 80
        mobile:
          type: [string, 'null']
          maxLength: 32
    ChangePasswordBody:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 255 }
    ForgotPasswordResponse:
      type: object
      required: [success, emailConfigured]
      properties:
        success:
          type: boolean
          const: true
        emailConfigured:
          type: boolean
          description: False when no SMTP settings are saved, so the UI can tell the user to contact an admin instead.
    ResetPasswordBody:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    SmtpSettings:
      type: object
      required: [configured, provider, host, port, secure, username, fromEmail, fromName, hasPassword, graphTenantId, graphClientId, hasGraphClientSecret, graphSenderEmail]
      properties:
        configured: { type: boolean }
        provider:
          type: string
          enum: [smtp, graph]
        host: { type: [string, 'null'] }
        port: { type: [number, 'null'] }
        secure: { type: [boolean, 'null'] }
        username: { type: [string, 'null'] }
        fromEmail: { type: [string, 'null'] }
        fromName: { type: [string, 'null'] }
        hasPassword: { type: boolean }
        graphTenantId: { type: [string, 'null'] }
        graphClientId: { type: [string, 'null'] }
        hasGraphClientSecret: { type: boolean }
        graphSenderEmail: { type: [string, 'null'] }
    UpdateSmtpSettingsBody:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [smtp, graph]
        host:
          type: [string, 'null']
          maxLength: 255
        port:
          type: [integer, 'null']
          minimum: 1
          maximum: 65535
        secure: { type: [boolean, 'null'] }
        username:
          type: [string, 'null']
          maxLength: 255
        password:
          type: [string, 'null']
          maxLength: 255
          description: Omit or null to keep the existing password.
        fromEmail:
          type: [string, 'null']
          format: email
          minLength: 3
          maxLength: 255
        fromName:
          type: [string, 'null']
          maxLength: 120
        graphTenantId:
          type: [string, 'null']
          maxLength: 120
        graphClientId:
          type: [string, 'null']
          maxLength: 120
        graphClientSecret:
          type: [string, 'null']
          maxLength: 255
          description: Omit or null to keep the existing secret.
        graphSenderEmail:
          type: [string, 'null']
          format: email
          minLength: 3
          maxLength: 255
    TestSmtpBody:
      type: object
      required: [to]
      properties:
        to: { type: string, format: email, minLength: 3, maxLength: 255 }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    AppUser:
      $ref: '#/components/schemas/AuthUser'
    CreateUserBody:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 200 }
        firstName:
          type: [string, 'null']
          maxLength: 80
        lastName:
          type: [string, 'null']
          maxLength: 80
        mobile:
          type: [string, 'null']
          maxLength: 32
        role:
          type: string
          enum: [admin, user]
          default: user
    UpdateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 255
        firstName:
          type: [string, 'null']
          maxLength: 80
        lastName:
          type: [string, 'null']
          maxLength: 80
        mobile:
          type: [string, 'null']
          maxLength: 32
        role:
          type: string
          enum: [admin, user]
        password:
          type: string
          minLength: 8
          maxLength: 200
    UpdateUserRoleBody:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, user]

    Project:
      type: object
      required: [id, name, location, contractStart, contractEnd, createdAt, isAdminOwned, currentUserCanViewSummary, currentUserCanEditEntries, currentUserCanResetApproval, approvalChain, pdfRequired, disabled]
      properties:
        id: { type: string }
        name: { type: string }
        code:
          type: [string, 'null']
        location: { type: string }
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        notes:
          type: [string, 'null']
        pdfRequired:
          type: boolean
          description: When true, an entry on this project requires at least one attached PDF before it can be submitted for approval.
        disabled:
          type: boolean
          description: When true, the project is hidden from all non-admin users, even those with explicit access. Admins still see it.
        allowDuplicateDates:
          type: boolean
          description: When true, multiple daily entries may share the same date on this project. When false (default), creating a second entry for a date is rejected.
        backdatedDays:
          type: [integer, 'null']
          minimum: 0
          description: How many days in the past a non-admin may date an entry. 0 blocks backdated entries entirely; null means no limit.
        futureDays:
          type: [integer, 'null']
          minimum: 0
          description: How many days in the future a non-admin may date an entry. 0 blocks future entries entirely; null means no limit.
        createdAt: { type: string, format: date-time }
        isAdminOwned: { type: boolean }
        currentUserCanViewSummary: { type: boolean }
        currentUserCanEditEntries: { type: boolean }
        currentUserCanResetApproval: { type: boolean }
        approvalChain:
          type: array
          description: Ordered approval chain for this project (position 1 is first, last is final lock).
          items:
            $ref: '#/components/schemas/ApprovalChainEntry'
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [services]
          properties:
            services:
              type: array
              items:
                $ref: '#/components/schemas/ProjectService'
    CreateProjectBody:
      type: object
      required: [name, location, contractStart, contractEnd]
      properties:
        name: { type: string, minLength: 1 }
        code:
          type: string
          maxLength: 32
          description: Optional short code used as the prefix for entry sequence numbers (e.g. ACME → ACME-0001).
        location: { type: string, minLength: 1 }
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        notes: { type: string }
        pdfRequired: { type: boolean }
        allowDuplicateDates: { type: boolean }
        backdatedDays:
          type: [integer, 'null']
          minimum: 0
        futureDays:
          type: [integer, 'null']
          minimum: 0
    UpdateProjectBody:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code:
          type: [string, 'null']
          maxLength: 32
        location: { type: string, minLength: 1 }
        contractStart: { type: string, format: date }
        contractEnd: { type: string, format: date }
        notes: { type: string }
        pdfRequired: { type: boolean }
        disabled: { type: boolean }
        allowDuplicateDates: { type: boolean }
        backdatedDays:
          type: [integer, 'null']
          minimum: 0
        futureDays:
          type: [integer, 'null']
          minimum: 0

    ServiceSubItem:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 255 }
        sortOrder: { type: integer }
        color:
          type: string
          nullable: true
          description: Optional hex color (#RRGGBB) for charts/legends.
    SubItemInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          description: When set, identifies an existing sub-item to rename / reorder.
        name: { type: string, minLength: 1, maxLength: 255 }
        sortOrder: { type: integer }
        color:
          type: string
          nullable: true
          description: Optional hex color (#RRGGBB).
    FoodMealItem:
      type: object
      required: [id, name, weight, sortOrder]
      description: A meal type defined for a kind=food service.
      properties:
        id: { type: string }
        name: { type: string }
        weight:
          type: number
          description: Manday weight as a fraction (0.2 = 20% of a manday).
        sortOrder: { type: integer }
    FoodMealItemInput:
      type: object
      required: [name, weight]
      properties:
        id:
          type: string
          description: When set, identifies an existing meal item to update.
        name: { type: string, minLength: 1, maxLength: 255 }
        weight:
          type: number
          minimum: 0
          maximum: 100
          description: Manday weight as a fraction (0.2 = 20% of a manday).
        sortOrder: { type: integer }

    ProjectService:
      type: object
      required: [id, projectId, name, kind, sortOrder, subItems, mealItems, hasEntries]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        sortOrder: { type: integer }
        color:
          type: string
          nullable: true
          description: Optional hex color (#RRGGBB) used as the service's brand color in tables and charts.
        subItems:
          type: array
          description: Defined sub-services for kind=group; empty array otherwise.
          items:
            $ref: '#/components/schemas/ServiceSubItem'
        mealItems:
          type: array
          description: |
            Defined meal types for kind=food; empty array otherwise. Fully
            editable at any time — daily entries snapshot the name + weight
            they were saved with, so edits never change historical numbers.
          items:
            $ref: '#/components/schemas/FoodMealItem'
        hasEntries:
          type: boolean
          description: |
            True if at least one daily-entry cost row references this service.
            Used by the UI to lock add/remove of sub-items on group services
            once historical entries exist (rename/reorder remain allowed).
    CreateProjectServiceBody:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [food, standard, group]
        sortOrder: { type: integer }
        color:
          type: string
          nullable: true
        subItems:
          type: array
          description: Initial sub-items (only meaningful when kind=group).
          items:
            $ref: '#/components/schemas/SubItemInput'
        mealItems:
          type: array
          description: |
            Initial meal types (only meaningful when kind=food). When omitted
            for a food service, the default five (Breakfast 20%, Lunch /
            Dinner / Midnight / Meal box 40%) are created.
          items:
            $ref: '#/components/schemas/FoodMealItemInput'
    UpdateProjectServiceBody:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [food, standard, group]
        sortOrder: { type: integer }
        color:
          type: string
          nullable: true
        subItems:
          type: array
          description: |
            Full replacement set of sub-items. Items with `id` are kept
            (rename / reorder); items without `id` are inserted; existing
            sub-items not present are deleted. Add/remove is rejected with
            409 once any cost entry references the parent service.
          items:
            $ref: '#/components/schemas/SubItemInput'
        mealItems:
          type: array
          description: |
            Full replacement set of meal types for a kind=food service. Items
            with `id` are updated (rename / re-weight / reorder); items
            without `id` are inserted; existing items not present are
            deleted. Always allowed — historical entries keep the snapshot
            they were saved with.
          items:
            $ref: '#/components/schemas/FoodMealItemInput'
    ReorderProjectServiceItem:
      type: object
      required: [id, sortOrder]
      properties:
        id: { type: string }
        sortOrder: { type: integer }
    ReorderProjectServicesBody:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ReorderProjectServiceItem'

    SecurityGroup:
      type: object
      required: [id, name, canViewSummary, canEditEntries, canResetApproval, autoAssignNewProjects, assignmentCount, memberCount, createdAt]
      description: |
        A reusable named bundle of permission flags. When a `project_access` row
        references a security group, the user's effective permissions are the
        OR-merge of the group's flags and the row's own flags. Users added as
        global MEMBERS of a group get the group's flags on every project.
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, nullable: true }
        canViewSummary: { type: boolean }
        canEditEntries: { type: boolean }
        canResetApproval: { type: boolean }
        autoAssignNewProjects:
          type: boolean
          description: |
            When true, every MEMBER of this group is automatically granted a
            project_access row (linked to this group) on each newly created
            project.
        assignmentCount:
          type: integer
          minimum: 0
          description: How many project_access rows currently reference this group.
        memberCount:
          type: integer
          minimum: 0
          description: How many users are global members of this group (flags apply to all projects).
        createdAt: { type: string, format: date-time }
    SecurityGroupMember:
      type: object
      required: [id, securityGroupId, userId, grantedAt, user]
      properties:
        id: { type: string }
        securityGroupId: { type: string }
        userId: { type: string }
        grantedAt: { type: string, format: date-time }
        user:
          $ref: '#/components/schemas/AppUser'
    AddSecurityGroupMemberBody:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    CreateSecurityGroupBody:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, nullable: true }
        canViewSummary: { type: boolean, default: false }
        canEditEntries: { type: boolean, default: false }
        canResetApproval: { type: boolean, default: false }
        autoAssignNewProjects: { type: boolean, default: false }
    UpdateSecurityGroupBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, nullable: true }
        canViewSummary: { type: boolean }
        canEditEntries: { type: boolean }
        canResetApproval: { type: boolean }
        autoAssignNewProjects: { type: boolean }

    ProjectAccess:
      type: object
      required:
        - id
        - projectId
        - userId
        - canViewSummary
        - canEditEntries
        - canResetApproval
        - effectiveCanViewSummary
        - effectiveCanEditEntries
        - effectiveCanResetApproval
        - grantedAt
        - user
      properties:
        id: { type: string }
        projectId: { type: string }
        userId: { type: string }
        securityGroupId:
          type: string
          nullable: true
          description: When set, the linked group's flags are OR-merged with this row's flags.
        securityGroup:
          $ref: '#/components/schemas/SecurityGroup'
          nullable: true
        canViewSummary:
          type: boolean
          description: Per-row "extra" flag, granted in addition to the group's flag (if any).
        canEditEntries: { type: boolean }
        canResetApproval: { type: boolean }
        effectiveCanViewSummary:
          type: boolean
          description: Final permission used for authorization checks (group OR row).
        effectiveCanEditEntries: { type: boolean }
        effectiveCanResetApproval: { type: boolean }
        grantedAt: { type: string, format: date-time }
        user:
          $ref: '#/components/schemas/AppUser'
    GrantAccessBody:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        securityGroupId:
          type: string
          nullable: true
        canViewSummary:
          type: boolean
          default: true
        canEditEntries:
          type: boolean
          default: false
        canResetApproval:
          type: boolean
          default: false
    UpdateAccessBody:
      type: object
      properties:
        securityGroupId:
          type: string
          nullable: true
        canViewSummary: { type: boolean }
        canEditEntries: { type: boolean }
        canResetApproval: { type: boolean }

    ApproverAssignment:
      type: object
      required: [id, projectId, level, levelName, userId, user]
      properties:
        id: { type: string }
        projectId: { type: string }
        level:
          type: integer
          minimum: 1
        levelName: { type: string }
        userId: { type: string }
        user:
          $ref: '#/components/schemas/AppUser'
    SetProjectApproversBody:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            type: object
            required: [level, userId]
            properties:
              level:
                type: integer
                minimum: 1
              userId: { type: string }

    ApprovalChainEntry:
      type: object
      required: [position, levelName]
      properties:
        id:
          type: string
          nullable: true
          description: >-
            Stable persisted id of the approval level. Null for the synthetic
            default chain (before any chain is saved). When sending a set-chain
            request, include the id of each surviving level so assignments
            follow the level across renames and reorders.
        position:
          type: integer
          minimum: 1
        levelName:
          type: string
          minLength: 1
          maxLength: 32
    SetApprovalChainBody:
      type: object
      required: [chain]
      properties:
        chain:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ApprovalChainEntry'

    ServiceCatalogItem:
      type: object
      required: [id, projectId, projectName, name, kind]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        color:
          type: string
          nullable: true

    AuditLogEntry:
      type: object
      required: [id, dailyEntryId, projectId, action, occurredAt]
      properties:
        id: { type: string }
        dailyEntryId:
          type: [string, 'null']
        projectId: { type: string }
        action:
          type: string
          description: 'CREATE | UPDATE | DELETE | APPROVE | REJECT | RESET | SUBMIT'
        level:
          type: [integer, 'null']
        levelName:
          type: [string, 'null']
        field:
          type: [string, 'null']
        oldValue:
          type: [string, 'null']
        newValue:
          type: [string, 'null']
        actorId:
          type: [string, 'null']
        actorName:
          type: [string, 'null']
        occurredAt: { type: string, format: date-time }

    MealQuantityInput:
      type: object
      required: [qty]
      properties:
        mealItemId:
          type: [string, 'null']
          description: |
            The service meal item this quantity is for. Null only when
            editing an entry whose saved meal type has since been removed
            from the service — the row is then matched by `name`.
        name:
          type: string
          description: Required when mealItemId is null (snapshot row match).
        qty:
          type: integer
          minimum: 0
    MealQuantityBreakdown:
      type: object
      required: [mealItemId, name, weight, qty]
      properties:
        mealItemId:
          type: [string, 'null']
        name: { type: string }
        weight:
          type: number
          description: Snapshot weight (fraction) taken when the entry was saved.
        qty: { type: integer }
    SubServiceCostInput:
      type: object
      required: [subItemId]
      properties:
        subItemId: { type: string }
        cost:
          type: number
          minimum: 0
          default: 0
        mandays:
          type: number
          minimum: 0
          default: 0
    SubServiceCostBreakdown:
      type: object
      required: [subItemId, subItemName, cost, mandays]
      properties:
        subItemId: { type: string }
        subItemName: { type: string }
        cost: { type: number }
        mandays: { type: number }

    ServiceCostInput:
      type: object
      required: [projectServiceId, kind]
      properties:
        projectServiceId: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        cost:
          type: number
          description: Total daily cost for this service line (SAR)
        mandays:
          type: number
          minimum: 0
          description: Optional per-service mandays contribution
        manualMandays:
          type: number
          minimum: 0
          description: |
            Per-service manual mandays added on top of the auto-computed
            (food formula) mandays. Used by food services to add ad-hoc
            mandays not captured by the meal counts.
        mealQuantities:
          type: array
          description: |
            Per meal-type quantity rows for kind=food services. On create,
            `mealItemId` must reference one of the service's meal items and
            the server snapshots its current name + weight. On update, rows
            whose `mealItemId` matches a previously saved row keep that row's
            snapshot; rows for meal items deleted since the entry was saved
            are matched by `name`. Mandays for the food line are computed
            server-side as sum(qty x weight) + manualMandays.
          items:
            $ref: '#/components/schemas/MealQuantityInput'
        subCosts:
          type: array
          description: |
            Per sub-item cost+mandays rows for kind=group services. Cost and
            mandays for the parent service line are derived as the sum of
            these rows (plus manualMandays for mandays). Ignored for other kinds.
          items:
            $ref: '#/components/schemas/SubServiceCostInput'
    ServiceCostBreakdown:
      type: object
      required: [id, projectServiceId, serviceName, kind, cost, mandayContribution, costPerManday]
      properties:
        id: { type: string }
        projectServiceId: { type: string }
        serviceName: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        cost: { type: number }
        mandays:
          type: [number, 'null']
        manualMandays:
          type: number
          description: Per-service manual mandays added on top of the auto-computed value.
        mandayContribution: { type: number }
        costPerManday: { type: number }
        mealQuantities:
          type: array
          description: |
            Per meal-type rows for kind=food; empty for other kinds. Name and
            weight are the snapshot taken when the entry was saved, so they
            stay correct even after the service's meal items are edited or
            removed (mealItemId becomes null on removal).
          items:
            $ref: '#/components/schemas/MealQuantityBreakdown'
        subCosts:
          type: array
          description: Per sub-item rows for kind=group; empty for other kinds.
          items:
            $ref: '#/components/schemas/SubServiceCostBreakdown'

    EntryApproval:
      type: object
      required: [id, dailyEntryId, level, levelName, approvedAt]
      properties:
        id: { type: string }
        dailyEntryId: { type: string }
        level: { type: integer }
        levelName: { type: string }
        approverId:
          type: [string, 'null']
        approverName:
          type: [string, 'null']
        approvedAt: { type: string, format: date-time }

    EntryStatus:
      type: string
      enum: [draft, pending, approved]
      description: |
        Workflow state. `draft` = created but not yet submitted (won't show
        up in approver queues). `pending` = submitted; advancing through the
        approval chain. `approved` = final approval recorded; entry is locked.
    DailyEntrySummary:
      type: object
      required: [id, projectId, projectName, entryDate, location, totalMandays, totalCost, costPerManday, totalMandaysOverride, manualMandays, status, currentApprovalLevel, isLocked, attachmentCount]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        entryDate: { type: string, format: date }
        location: { type: string }
        totalMandays: { type: number }
        totalCost: { type: number }
        costPerManday: { type: number }
        totalMandaysOverride: { type: boolean }
        manualMandays:
          type: number
          minimum: 0
          description: Extra mandays added on top of the auto-summed service mandays. Ignored when totalMandaysOverride is true.
        attachmentCount:
          type: integer
          minimum: 0
          description: Number of files attached to this entry.
        status:
          $ref: '#/components/schemas/EntryStatus'
        currentApprovalLevel: { type: integer }
        isLocked: { type: boolean }
        lockedAt:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
        sequenceNumber:
          type: [integer, 'null']
        sequenceCode:
          type: [string, 'null']
    DailyEntryDetail:
      allOf:
        - $ref: '#/components/schemas/DailyEntrySummary'
        - type: object
          required: [serviceCosts, attachments]
          properties:
            serviceCosts:
              type: array
              items:
                $ref: '#/components/schemas/ServiceCostBreakdown'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/EntryAttachment'
    CreateDailyEntryBody:
      type: object
      required: [entryDate, location, serviceCosts]
      properties:
        entryDate: { type: string, format: date }
        location: { type: string, minLength: 1 }
        totalMandays:
          type: number
          minimum: 0
          description: Only honored when totalMandaysOverride is true; otherwise auto-summed from serviceCosts plus manualMandays.
        totalMandaysOverride:
          type: boolean
          default: false
        manualMandays:
          type: number
          minimum: 0
          default: 0
          description: Added on top of auto-summed service mandays. Ignored when totalMandaysOverride is true.
        notes: { type: string }
        serviceCosts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCostInput'
    UpdateDailyEntryBody:
      type: object
      properties:
        entryDate: { type: string, format: date }
        location: { type: string, minLength: 1 }
        totalMandays:
          type: number
          minimum: 0
        totalMandaysOverride:
          type: boolean
        manualMandays:
          type: number
          minimum: 0
        notes: { type: string }
        serviceCosts:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCostInput'
    EntryAttachment:
      type: object
      required: [id, dailyEntryId, objectPath, fileName, fileSize, mimeType, uploadedAt]
      properties:
        id: { type: string }
        dailyEntryId: { type: string }
        objectPath:
          type: string
          description: Normalized path returned by the storage upload endpoint (begins with `/objects/...`).
        fileName: { type: string }
        fileSize: { type: integer, minimum: 0 }
        mimeType: { type: string }
        uploadedById:
          type: [string, 'null']
        uploadedAt: { type: string, format: date-time }
    CreateEntryAttachmentBody:
      type: object
      required: [objectPath, fileName]
      properties:
        objectPath: { type: string, minLength: 1 }
        fileName: { type: string, minLength: 1, maxLength: 255 }
        fileSize: { type: integer, minimum: 0, default: 0 }
        mimeType: { type: string, maxLength: 128 }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    DashboardKpi:
      type: object
      required: [totalCost, totalMandays, costPerManday, entryCount]
      properties:
        totalCost: { type: number }
        totalMandays: { type: number }
        costPerManday: { type: number }
        entryCount: { type: integer }
    ServiceTotal:
      type: object
      required: [serviceName, kind, totalCost, totalMandayContribution]
      properties:
        serviceName: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        color:
          type: string
          nullable: true
        totalCost: { type: number }
        totalMandayContribution: { type: number }
    SubServiceTotal:
      type: object
      description: |
        Per-sub-service totals inside a group service's breakdown row.
        Only present when the parent service kind is "group".
      required: [subItemId, name, totalCost, totalMandayContribution, costPerManday]
      properties:
        subItemId: { type: string }
        name: { type: string }
        color:
          type: string
          nullable: true
        totalCost: { type: number }
        totalMandayContribution: { type: number }
        costPerManday: { type: number }
    ProjectServiceTotal:
      type: object
      description: |
        Per-project, per-service totals for the selected date range. The same
        service NAME in different projects is reported as separate rows
        (keyed on projectId + serviceId).
      required:
        - projectId
        - projectName
        - serviceId
        - serviceName
        - kind
        - totalCost
        - totalMandayContribution
        - costPerManday
      properties:
        projectId: { type: string }
        projectName: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        color:
          type: string
          nullable: true
        totalCost: { type: number }
        totalMandayContribution: { type: number }
        costPerManday: { type: number }
        subBreakdown:
          type: array
          description: |
            For kind="group" services: per-sub-service totals so the UI can
            expand the row inline. Empty / omitted for non-group services.
          items:
            $ref: '#/components/schemas/SubServiceTotal'
        components:
          type: array
          description: |
            Full breakdown of this service for the range: meal types
            (kind=meal, qty + mandays) for food services, sub-services
            (kind=sub, cost + mandays) for group services. Empty for
            standard services.
          items:
            $ref: '#/components/schemas/ReportComponentCell'
    ServiceEntryRow:
      type: object
      description: |
        One row per (daily entry × service) used by the service drill-down view.
      required:
        - entryId
        - projectId
        - projectName
        - serviceId
        - serviceName
        - kind
        - entryDate
        - location
        - cost
        - mandayContribution
        - costPerManday
      properties:
        entryId: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        kind:
          type: string
          enum: [food, standard, group]
        color:
          type: string
          nullable: true
        entryDate: { type: string, format: date }
        location: { type: string }
        cost: { type: number }
        mandayContribution: { type: number }
        costPerManday: { type: number }
        sequenceCode:
          type: [string, 'null']
    ReportComponentCell:
      type: object
      description: |
        One sub-component of a service inside a report cell: a meal type
        (kind=meal, from the entry's saved meal snapshots — qty + mandays,
        no per-meal cost) or a group sub-service (kind=sub — cost + mandays,
        no qty). `key` is stable across rows ("meal:<name>" / "sub:<id>")
        so the UI can align columns.
      required: [key, name, kind, mandays]
      properties:
        key: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [meal, sub]
        qty:
          type: [number, 'null']
        cost:
          type: [number, 'null']
        mandays: { type: number }
    EntryMatrixCostCell:
      type: object
      description: One service's cost contribution on a given entry.
      required: [serviceId, cost, mandayContribution, costPerManday]
      properties:
        serviceId: { type: string }
        cost: { type: number }
        mandayContribution: { type: number }
        costPerManday: { type: number }
        components:
          type: array
          description: Meal-type / sub-service breakdown for this cell (empty for standard services).
          items:
            $ref: '#/components/schemas/ReportComponentCell'
    EntryMatrixRow:
      type: object
      required:
        - entryId
        - entryDate
        - location
        - totalCost
        - totalMandays
        - costPerManday
        - status
        - costs
      properties:
        entryId: { type: string }
        entryDate: { type: string, format: date }
        location: { type: string }
        totalCost: { type: number }
        totalMandays: { type: number }
        costPerManday: { type: number }
        sequenceCode:
          type: [string, 'null']
        sequenceNumber:
          type: [integer, 'null']
        status:
          $ref: '#/components/schemas/EntryStatus'
        currentApprovalLevel: { type: integer }
        isLocked: { type: boolean }
        costs:
          type: array
          items:
            $ref: '#/components/schemas/EntryMatrixCostCell'
    EntryMatrixServiceTotal:
      type: object
      required: [serviceId, totalCost, totalMandayContribution, costPerManday]
      properties:
        serviceId: { type: string }
        totalCost: { type: number }
        totalMandayContribution: { type: number }
        costPerManday: { type: number }
        components:
          type: array
          description: |
            Per-component totals across the range, in display order. Also
            serves as the union of component columns for the UI.
          items:
            $ref: '#/components/schemas/ReportComponentCell'
    EntryMatrixReport:
      type: object
      description: |
        Entry-wise pivot for a single project. `services` are the project's
        services (in display order) used as horizontal columns. `entries` is
        one row per daily entry in the date range with sparse `costs[]`
        keyed by serviceId. `serviceTotals` lets the UI render a footer.
      required: [project, range, services, entries, serviceTotals]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        services:
          type: array
          items:
            $ref: '#/components/schemas/ProjectService'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EntryMatrixRow'
        serviceTotals:
          type: array
          items:
            $ref: '#/components/schemas/EntryMatrixServiceTotal'

    MisRole:
      type: string
      enum: [mis_admin, mis_manager, project_manager, finance, data_entry, viewer, custom]
    MisPermission:
      type: string
      description: A grantable MIS permission. Effective permissions are role permissions plus extraPermissions.
      enum: [authorities, projects, configuration, project_config, tabs, services, entries, submit, approve, reports, export, financial, history, reset, rate_override, delete_approved, edit_approved, view_project, view_entries, create_entries, edit_entries, delete_entries, overhead, op_expense]
    MisProjectStatus:
      type: string
      enum: [active, inactive]
    MisTabType:
      type: string
      enum: [income, cost, expense, salary, other]
    MisFinancialClass:
      type: string
      description: How the tab contributes to financial totals; excluded has no profit impact.
      enum: [income, cost, expense, salary, excluded]
    MisEntryStatus:
      type: string
      enum: [draft, submitted, approved, rejected, returned, cancelled]
    MisEntryAction:
      type: string
      enum: [submit, approve, reject, return, reset, cancel]
    MisReportType:
      type: string
      enum: [income, cost, expense, salary, summary, project-profitability, project-comparison, period-comparison, service-tab-comparison]
    MisExportFormat:
      type: string
      enum: [xlsx, pdf, csv]

    MisProjectPermissionGrant:
      type: object
      required: [projectId, permissions]
      properties:
        projectId: { type: string }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/MisPermission' }
    MisMe:
      type: object
      description: |
        The current user's MIS membership. A caller has no MIS access when
        hasAccess is false. `projectPermissions` is the effective grant per
        project and is the source of truth for project-scoped UI gates.
      required: [hasAccess, roles, permissions, projectIds, globalAccess, projectPermissions]
      properties:
        hasAccess: { type: boolean }
        roles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/MisRole' }
        permissions:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/MisPermission' }
        projectIds:
          type: array
          uniqueItems: true
          items: { type: string }
        globalAccess: { type: boolean }
        projectPermissions:
          type: array
          description: Empty for a global-only membership without project-specific grants.
          items: { $ref: '#/components/schemas/MisProjectPermissionGrant' }
    MisUserPickerItem:
      type: object
      required: [id, email, firstName, lastName, displayName]
      properties:
        id: { type: string }
        email: { type: [string, 'null'], format: email }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        displayName: { type: string }
    MisUserPickerPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MisUserPickerItem' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    MisAuthorityInput:
      type: object
      description: A full authority grant. projectId null grants the role globally.
      required: [userId, projectId, role, extraPermissions]
      properties:
        userId: { type: string }
        projectId: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/MisRole' }
        extraPermissions:
          type: array
          uniqueItems: true
          description: Explicit permissions added to, never subtracted from, the role's standard permissions.
          items: { $ref: '#/components/schemas/MisPermission' }
    MisAuthority:
      allOf:
        - $ref: '#/components/schemas/MisAuthorityInput'
        - type: object
          required: [id, user, createdAt, updatedAt]
          properties:
            id: { type: string }
            user: { $ref: '#/components/schemas/MisUserPickerItem' }
            projectName: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MisAuthorityPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MisAuthority' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    MisReportingSettings:
      type: object
      description: Explicit, small project reporting controls; no untyped settings blob is used.
      required: [defaultEntryStatus, preventDuplicatePeriods]
      properties:
        defaultEntryStatus:
          $ref: '#/components/schemas/MisEntryStatus'
          default: approved
          description: Default status filter for project reporting; entries still begin as draft.
        preventDuplicatePeriods:
          type: boolean
          description: Reject overlapping entries for the same project, tab, and service when true.
        allowMultipleEntries:
          type: boolean
          default: false
          description: Permit more than one MIS parent in a project period.
        overlapPolicy:
          type: string
          enum: [nonoverlap, overlap, unlimited]
          default: nonoverlap
          description: Period policy when multiple MIS entries are enabled.
        maxEntriesPerPeriod:
          type: [integer, 'null']
          minimum: 1
          description: Optional maximum number of entries that may cover a period.
    MisProjectInput:
      type: object
      description: Full writable MIS project values accepted by both create and PATCH.
      required: [name, code, managerId, status, startDate, endDate, currency, reportingSettings]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        code: { type: string, minLength: 1, maxLength: 32 }
        managerId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MisProjectStatus' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        currency: { type: string, minLength: 3, maxLength: 3, description: ISO 4217 currency code. }
        reportingSettings: { $ref: '#/components/schemas/MisReportingSettings' }
    MisProject:
      allOf:
        - $ref: '#/components/schemas/MisProjectInput'
        - type: object
          required: [id, manager, effectivePermissions, createdAt, updatedAt]
          properties:
            id: { type: string }
            manager:
              oneOf:
                - $ref: '#/components/schemas/MisUserPickerItem'
                - type: 'null'
            effectivePermissions:
              type: array
              description: Current caller's effective permissions for this project.
              uniqueItems: true
              items: { $ref: '#/components/schemas/MisPermission' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MisProjectPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MisProject' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    MisTabInput:
      type: object
      description: Full writable MIS tab/category master values accepted by both create and PATCH.
      required: [name, code, description, type, financialClass, sequence, active, allowEntry, allowReporting]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 32 }
        description: { type: [string, 'null'], maxLength: 1000 }
        type: { $ref: '#/components/schemas/MisTabType' }
        financialClass: { $ref: '#/components/schemas/MisFinancialClass' }
        rateEnabled:
          type: boolean
          default: true
          description: Whether new custom-type entries use quantity × rate.
        calculatePercentAgainstIncome:
          type: boolean
          default: false
          description: Type default for percentage against total income.
        sequence: { type: integer, minimum: 0 }
        active: { type: boolean }
        allowEntry: { type: boolean }
        allowReporting: { type: boolean }
    MisTab:
      allOf:
        - $ref: '#/components/schemas/MisTabInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MisProjectTabAssignmentInput:
      type: object
      required: [tabId, enabled, sequence]
      properties:
        tabId: { type: string }
        enabled: { type: boolean }
        sequence: { type: integer, minimum: 0 }
        calculatePercentAgainstIncome:
          type: [boolean, 'null']
          description: Optional project-tab override; null inherits the type default.
    MisProjectTabAssignmentsInput:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items: { $ref: '#/components/schemas/MisProjectTabAssignmentInput' }
    MisProjectTabAssignment:
      allOf:
        - $ref: '#/components/schemas/MisProjectTabAssignmentInput'
        - type: object
          required: [projectId, tab]
          properties:
            projectId: { type: string }
            tab: { $ref: '#/components/schemas/MisTab' }

    MisServiceInput:
      type: object
      description: Full writable project-local service values accepted by both create and PATCH.
      required: [tabId, name, description, unit, defaultRate, active, sequence, effectiveFrom, effectiveTo]
      properties:
        tabId: { type: string }
        quantitySourceServiceId:
          type: [string, 'null']
          description: Optional same-project Income service whose quantity defaults into this Cost service. Null removes the link.
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: Project-local service code. Omit on create to generate a safe code.
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 1000 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        defaultRate: { type: number, minimum: 0, description: API number; persisted as an exact database decimal. }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 service currency. Defaults to the project currency.
        active: { type: boolean }
        sequence: { type: integer, minimum: 0 }
        effectiveFrom: { type: [string, 'null'], format: date }
        effectiveTo: { type: [string, 'null'], format: date }
    MisService:
      allOf:
        - $ref: '#/components/schemas/MisServiceInput'
        - type: object
          required: [id, projectId, code, currency, tabName, tabType, financialClass, rateEnabled, calculatePercentAgainstIncome, calculationMode, createdAt, updatedAt]
          properties:
            id: { type: string }
            projectId: { type: string }
            code: { type: string }
            currency: { type: string }
            tabName: { type: string }
            tabType: { $ref: '#/components/schemas/MisTabType' }
            financialClass: { $ref: '#/components/schemas/MisFinancialClass' }
            rateEnabled: { type: boolean, description: Effective rate behavior for new entries. }
            calculatePercentAgainstIncome: { type: boolean, description: Effective percentage behavior for new entries. }
            calculationMode:
              type: string
              enum: [quantity_rate, amount]
              description: Effective mode for a new entry.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    MisEntryInput:
      type: object
      description: Full writable transaction values. amount and all snapshot fields are server-owned.
      required: [projectId, tabId, serviceId, fromDate, toDate, remarks]
      properties:
        projectId: { type: string }
        tabId: { type: string }
        serviceId: { type: string }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        quantity: { type: [number, 'null'], minimum: 0, description: Required for quantity_rate mode; explicit zero is valid. }
        rate: { type: [number, 'null'], minimum: 0, description: Required for quantity_rate mode; authorization-gated for overrides. }
        amount: { type: [number, 'null'], minimum: 0, description: Required for amount mode; actual amount, not quantity × rate. }
        calculationMode:
          type: string
          enum: [quantity_rate, amount]
          description: Optional explicit mode for an intentional legacy Salary/Expense transition.
        remarks: { type: [string, 'null'], maxLength: 2000 }
        rateReason:
          type: [string, 'null']
          maxLength: 1000
          description: Required for a rate override; retained only in the audit trail.
    MisBulkEntryLine:
      type: object
      required: [serviceId]
      properties:
        id: { type: string, description: Existing child ID when replacing a parent line; required to preserve line identity during edits. }
        serviceId: { type: string }
        quantity:
          type: [number, 'null']
          minimum: 0
          description: Omit or null to skip a blank client line; zero is explicit and is saved.
        rate: { type: [number, 'null'], minimum: 0 }
        amount: { type: [number, 'null'], minimum: 0 }
        calculationMode: { type: string, enum: [quantity_rate, amount] }
        remarks: { type: [string, 'null'], maxLength: 2000 }
        rateReason: { type: [string, 'null'], maxLength: 1000 }
        fromDate: { type: [string, 'null'], format: date }
        toDate: { type: [string, 'null'], format: date }
    MisBulkEntriesInput:
      type: object
      required: [projectId, fromDate, toDate, lines, action]
      properties:
        projectId: { type: string }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        lines:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/MisBulkEntryLine' }
        action:
          type: string
          enum: [draft, submit]
    MisBulkEntriesResponse:
      type: object
      required: [parent, items]
      properties:
        parent: { $ref: '#/components/schemas/MisParent' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MisEntry' }
    MisEntry:
      allOf:
        - $ref: '#/components/schemas/MisEntryInput'
        - type: object
          required: [id, amount, calculationMode, rateEnabled, calculatePercentAgainstIncome, projectName, tabName, serviceName, type, financialClass, unit, currency, status, createdById, createdAt, updatedAt, parentId, bulkNumber]
          properties:
            id: { type: string }
            parentId: { type: [string, 'null'], description: Parent bulk transaction ID; null for legacy standalone entries. }
            bulkNumber: { type: [string, 'null'], description: Immutable MIS-BULK number; null for legacy standalone entries. }
            amount: { type: number, description: Server-computed or direct actual amount; persisted as an exact database decimal. }
            calculationMode: { type: string, enum: [quantity_rate, amount] }
            rateEnabled: { type: boolean }
            calculatePercentAgainstIncome: { type: boolean }
            projectName: { type: string }
            tabName: { type: string }
            serviceName: { type: string }
            type: { $ref: '#/components/schemas/MisTabType' }
            financialClass: { $ref: '#/components/schemas/MisFinancialClass' }
            unit: { type: string }
            currency: { type: string }
            status: { $ref: '#/components/schemas/MisEntryStatus' }
            createdById: { type: string }
            createdByName: { type: [string, 'null'] }
            updatedById: { type: [string, 'null'] }
            updatedByName: { type: [string, 'null'] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    MisEntryPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MisEntry' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    MisServiceReorderInput:
      type: object
      required: [serviceIds]
      properties:
        serviceIds:
          type: array
          description: Complete permutation of every service ID in the project.
          items: { type: string }
    MisEntryActionInput:
      type: object
      required: [action, remarks]
      properties:
        action: { $ref: '#/components/schemas/MisEntryAction' }
        remarks: { type: [string, 'null'], maxLength: 2000 }
    MisEntryHistoryItem:
      type: object
      required: [id, entryId, action, actorId, occurredAt]
      properties:
        id: { type: string }
        entryId: { type: string }
        action: { type: string, description: CREATE, UPDATE, DELETE, SUBMIT, APPROVE, REJECT, RETURN, RESET, CANCEL, or EDIT_APPROVED. }
        actorId: { type: [string, 'null'] }
        actorName: { type: [string, 'null'] }
        remarks: { type: [string, 'null'] }
        oldValues:
          type: [object, 'null']
          description: Audit-only untyped prior-value snapshot.
          additionalProperties: true
        newValues:
          type: [object, 'null']
          description: Audit-only untyped resulting-value snapshot.
          additionalProperties: true
        occurredAt: { type: string, format: date-time }

    MisParentStatus:
      $ref: '#/components/schemas/MisEntryStatus'
    MisParent:
      type: object
      required: [id, bulkNumber, projectId, projectName, projectNumber, fromDate, toDate, status, entryType, createdById, createdAt, updatedAt]
      properties:
        id: { type: string }
        bulkNumber: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        projectNumber: { type: string }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/MisParentStatus' }
        entryType: { type: string, enum: [bulk] }
        createdById: { type: string }
        createdByName: { type: [string, 'null'] }
        childCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MisParentDetail:
      type: object
      required: [parent, items]
      properties:
        parent: { $ref: '#/components/schemas/MisParent' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MisEntry' }
    MisParentPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MisParent' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    MisParentEditInput:
      type: object
      required: [fromDate, toDate, lines]
      properties:
        projectId: { type: string, description: Optional; the path parent project is used when omitted. }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        lines:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/MisBulkEntryLine' }
        action:
          type: string
          enum: [draft, submit]
          description: Optional status transition; omitted preserves the current parent status.
        reason: { type: [string, 'null'], maxLength: 2000, description: Required when editing an approved parent. }
    MisParentActionInput:
      type: object
      required: [action, remarks]
      properties:
        action:
          type: string
          enum: [submit, approve, reject, return, reset, cancel]
        remarks: { type: [string, 'null'], maxLength: 2000 }
    MisParentMutationResponse:
      $ref: '#/components/schemas/MisParentDetail'
    MisParentDeleteResponse:
      type: object
      required: [success, parentId, bulkNumber]
      properties:
        success: { type: boolean }
        parentId: { type: string }
        bulkNumber: { type: string }
    MisParentHistoryItem:
      allOf:
        - $ref: '#/components/schemas/MisEntryHistoryItem'
        - type: object
          required: [parentId, bulkNumber]
          properties:
            parentId: { type: string }
            bulkNumber: { type: string }

    MisFinancialTotals:
      type: object
      description: Totals are always scoped to one currency group and never sum currencies together.
      required: [income, cost, expenses, salaries, totalAmount, grossProfit, netProfit, profitMargin, entryCount]
      properties:
        income: { type: number }
        cost: { type: number }
        expenses: { type: number }
        salaries: { type: number }
        totalAmount: { type: number, description: Sum of all entry amounts in this aggregate, including custom/other types. }
        grossProfit: { type: number, description: Income minus cost. }
        netProfit: { type: number, description: Income minus cost, expenses, and salaries. }
        profitMargin: { type: number, description: Net profit ÷ income × 100; 0 when income is zero. }
        entryCount: { type: integer, minimum: 0 }
    MisReportGroupRow:
      type: object
      description: A report grouping row. Identity fields vary with reportType; null means that dimension is not grouped.
      required: [projectId, projectName, tabId, tabName, serviceId, serviceName, periodStart, periodEnd, currentTotals, comparisonTotals]
      properties:
        projectId: { type: [string, 'null'] }
        projectName: { type: [string, 'null'] }
        projectCode: { type: [string, 'null'] }
        tabId: { type: [string, 'null'] }
        tabName: { type: [string, 'null'] }
        type: { type: [string, 'null'] }
        serviceId: { type: [string, 'null'] }
        serviceCode: { type: [string, 'null'] }
        serviceName: { type: [string, 'null'] }
        serviceOrder: { type: [integer, 'null'], description: Persisted service sequence used for stable ordering. }
        calculatePercentAgainstIncome:
          type: [boolean, 'null']
          description: Effective entry snapshot configuration. Null means this aggregate mixes enabled and disabled rows.
        periodStart: { type: [string, 'null'], format: date }
        periodEnd: { type: [string, 'null'], format: date }
        currentTotals: { $ref: '#/components/schemas/MisFinancialTotals' }
        comparisonTotals:
          oneOf:
            - $ref: '#/components/schemas/MisFinancialTotals'
            - type: 'null'
    MisCurrencyReportGroup:
      type: object
      required: [currency, currentTotals, comparisonTotals, groups]
      properties:
        currency: { type: string }
        currentTotals: { $ref: '#/components/schemas/MisFinancialTotals' }
        comparisonTotals:
          oneOf:
            - $ref: '#/components/schemas/MisFinancialTotals'
            - type: 'null'
        groups:
          type: array
          items: { $ref: '#/components/schemas/MisReportGroupRow' }
    MisReport:
      type: object
      required: [reportType, currencyGroups]
      properties:
        reportType: { $ref: '#/components/schemas/MisReportType' }
        currencyGroups:
          type: array
          description: One group per currency, preventing invalid cross-currency totals.
          items: { $ref: '#/components/schemas/MisCurrencyReportGroup' }
    MisDashboardProjectRow:
      type: object
      required: [projectId, projectName, totals]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        totals: { $ref: '#/components/schemas/MisFinancialTotals' }
    MisDashboardTabRow:
      type: object
      required: [tabId, tabName, type, financialClass, totals]
      properties:
        tabId: { type: string }
        tabName: { type: string }
        type: { $ref: '#/components/schemas/MisTabType' }
        financialClass: { $ref: '#/components/schemas/MisFinancialClass' }
        totals: { $ref: '#/components/schemas/MisFinancialTotals' }
    MisDashboardPeriodRow:
      type: object
      required: [fromDate, toDate, totals]
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        totals: { $ref: '#/components/schemas/MisFinancialTotals' }
    MisDashboardCurrencyGroup:
      type: object
      required: [currency, totals, byProject, byTab, byPeriod]
      properties:
        currency: { type: string }
        byService:
          type: array
          items: { $ref: '#/components/schemas/MisDashboardServiceRow' }
        adjustedNetProfit:
          type: number
          description: Net profit after combined selected-project percentage charges. Omitted unless both charge permissions cover every selected project.
        totals: { $ref: '#/components/schemas/MisFinancialTotals' }
        byProject:
          type: array
          items: { $ref: '#/components/schemas/MisDashboardProjectRow' }
        byTab:
          type: array
          items: { $ref: '#/components/schemas/MisDashboardTabRow' }
        byPeriod:
          type: array
          items: { $ref: '#/components/schemas/MisDashboardPeriodRow' }
    MisDashboardServiceRow:
      type: object
      required: [serviceId, serviceName, tabId, tabName, financialClass, totals]
      properties:
        serviceId: { type: string }
        serviceName: { type: string }
        tabId: { type: string }
        tabName: { type: string }
        financialClass: { $ref: '#/components/schemas/MisFinancialClass' }
        totals: { $ref: '#/components/schemas/MisFinancialTotals' }
    MisPercentageKind:
      type: string
      enum: [overhead, op_expense]
    MisPercentageServiceInput:
      type: object
      required: [kind, name, percentage, active]
      properties:
        kind: { $ref: '#/components/schemas/MisPercentageKind' }
        name: { type: string, minLength: 1, maxLength: 160 }
        percentage: { type: number, minimum: 0, maximum: 100 }
        active: { type: boolean }
    MisPercentageService:
      allOf:
        - $ref: '#/components/schemas/MisPercentageServiceInput'
        - type: object
          required: [id, projectId]
          properties:
            id: { type: string }
            projectId: { type: string }
    MisPercentageCharge:
      type: object
      required: [id, name, percentage, amount]
      properties:
        id: { type: string }
        name: { type: string }
        percentage: { type: number }
        amount: { type: number }
    MisPercentageSection:
      type: object
      required: [total, services]
      properties:
        total: { type: number }
        services: { type: array, items: { $ref: '#/components/schemas/MisPercentageCharge' } }
    MisDashboardAdjustment:
      type: object
      required: [projectId, projectName, currency, income, baseProfit]
      description: Charges configured by this project applied to combined selected-project income for this currency and period/statuses. Restricted sections are omitted. Legacy adjustedProfit is not emitted.
      properties:
        projectId: { type: string }
        projectName: { type: string }
        currency: { type: string }
        income: { type: number }
        baseProfit: { type: number }
        overhead: { $ref: '#/components/schemas/MisPercentageSection' }
        opExpense: { $ref: '#/components/schemas/MisPercentageSection' }
        adjustedProfit: { type: number }
    MisDashboard:
      type: object
      required: [currencyGroups, recentEntries]
      properties:
        percentageAdjustments:
          type: array
          items: { $ref: '#/components/schemas/MisDashboardAdjustment' }
        currencyGroups:
          type: array
          description: Currency-separated totals and breakdown rows; values must not be aggregated across groups.
          items: { $ref: '#/components/schemas/MisDashboardCurrencyGroup' }
        recentEntries:
          type: array
          description: Recent entries limited to records the current user may access.
          items: { $ref: '#/components/schemas/MisEntry' }
    ProjectTotal:
      type: object
      required: [projectId, projectName, location, totalCost, totalMandays, costPerManday]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        location: { type: string }
        totalCost: { type: number }
        totalMandays: { type: number }
        costPerManday: { type: number }
    DashboardReport:
      type: object
      required: [today, weekToDate, monthToDate, serviceBreakdown, projectBreakdown]
      properties:
        today:
          $ref: '#/components/schemas/DashboardKpi'
        weekToDate:
          $ref: '#/components/schemas/DashboardKpi'
        monthToDate:
          $ref: '#/components/schemas/DashboardKpi'
        serviceBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTotal'
        projectBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTotal'
    RecentActivityItem:
      type: object
      required: [id, projectId, projectName, entryDate, totalCost, totalMandays, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        entryDate: { type: string, format: date }
        totalCost: { type: number }
        totalMandays: { type: number }
        createdAt: { type: string, format: date-time }
        createdByName:
          type: [string, 'null']

    ProjectSummaryReport:
      type: object
      required: [project, range, kpi, serviceBreakdown, dailyEntries]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        kpi:
          $ref: '#/components/schemas/DashboardKpi'
        serviceBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ProjectServiceTotal'
        dailyEntries:
          type: array
          items:
            $ref: '#/components/schemas/DailyEntrySummary'

    AggregateReport:
      type: object
      required: [range, kpi, serviceBreakdown, projectBreakdown]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        kpi:
          $ref: '#/components/schemas/DashboardKpi'
        serviceBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ProjectServiceTotal'
        projectBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/ProjectTotal'

    TrendPoint:
      type: object
      required: [date, totalCost, totalMandays, costPerManday]
      properties:
        date: { type: string, format: date }
        totalCost: { type: number }
        totalMandays: { type: number }
        costPerManday: { type: number }
    TrendsReport:
      type: object
      required: [range, points]
      properties:
        range:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
